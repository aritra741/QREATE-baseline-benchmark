# QAIRS Configuration

ollama:
  host: "http://localhost:11434"
  model: "qwen2.5:7b-instruct"
  temperature: 0.0
  max_tokens: 4096
  timeout: 300

database:
  host: "localhost"
  port: 5432
  database: "qairs"
  user: "postgres"
  password: ""

sieve:
  enable_dictionary: true
  enable_regex: true
  enable_ner: false
  
  dictionary_expansion: true
  max_synonyms_per_term: 10
  
  regex_patterns:
    has_date: '\b\d{1,2}[/-]\d{1,2}[/-]\d{2,4}\b|\b(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]* \d{1,2},? \d{4}\b'
    has_money: '\$\s?\d+(?:,\d{3})*(?:\.\d{2})?|\b\d+(?:,\d{3})*(?:\.\d{2})?\s?(?:dollars?|USD)\b'
    has_phone: '\b\d{3}[-.]?\d{3}[-.]?\d{4}\b'
    has_email: '\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Z|a-z]{2,}\b'
    has_ssn: '\b\d{3}-\d{2}-\d{4}\b'
  
  sieve_path: "sieve_index.pkl"

extraction:
  batch_size: 10
  max_retries: 3
  retry_delay: 2
  
  enable_parallel: true
  max_workers: 4
  
  extract_denormalized: true
  validate_schema: true
  
  system_prompt: "You are a strict data extraction engine. Extract structured data from text according to the provided schema."

# Corpus settings
chunk_size: 1000
chunk_overlap: 100
