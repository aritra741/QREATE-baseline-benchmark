paths:
  benchu_root: "../.."
  results_dir: "./results"

llm:
  # Active profile: qwen_local | ollama_qwen_7b | deepseek_v4_flash
  # Override at runtime: export SPP_LLM_PROFILE=ollama_qwen_7b
  profile: "qwen_local"
  provider: "local_vllm"
  max_params: "32B"
  preferred_family: "Qwen"
  extraction_model: "Qwen2.5-14B-Instruct"
  judge_model: "Qwen2.5-32B-Instruct"
  agent_model: "Qwen2.5-32B-Instruct"
  temperature: 0.0
  base_url: "http://localhost:8000/v1"
  request_timeout: 120
  # Set to true for cloud APIs that do not expose OpenAI-compatible /models
  skip_model_check: false

llm_profiles:
  qwen_local:
    provider: "local_vllm"
    preferred_family: "Qwen"
    extraction_model: "Qwen2.5-14B-Instruct"
    judge_model: "Qwen2.5-32B-Instruct"
    agent_model: "Qwen2.5-32B-Instruct"
    base_url: "http://localhost:8000/v1"
    request_timeout: 120
    skip_model_check: false
  ollama_qwen_7b:
    provider: "ollama"
    preferred_family: "Qwen"
    extraction_model: "qwen2.5:7b-instruct"
    judge_model: "qwen2.5:7b-instruct"
    agent_model: "qwen2.5:7b-instruct"
    base_url: "http://localhost:11434/v1"
    request_timeout: 300
    skip_model_check: false
    # Optional Ollama runtime options (num_ctx, temperature, etc.)
    ollama_options:
      num_ctx: 8192
  deepseek_v4_flash:
    provider: "deepseek"
    preferred_family: "DeepSeek"
    extraction_model: "deepseek-v4-flash"
    judge_model: "deepseek-v4-flash"
    agent_model: "deepseek-v4-flash"
    base_url: "https://api.deepseek.com/v1"
    api_key_env: "DEEPSEEK_API_KEY"
    skip_model_check: true
    # Optional: enable thinking mode via extra_body.thinking.type = enabled
    thinking: false

inference:
  max_input_tokens: 24000
  force_chunking_above_tokens: 16000

extraction:
  # Prompt from SQL workload demand only — never ground-truth schema.
  workload_aware: true
  # Parallel LLM calls for document extraction (I/O-bound). 1 = sequential.
  max_workers: 8

pipeline:
  # Parallel config materialization + evaluation workers.
  # Materialization is CPU-bound (embedding inference); set to 1 for sequential.
  # Only increase if running on a multi-core server or if er=none (no embedding).
  max_workers: 1

datasets:
  pilot: ["Player", "Med", "Finan"]

  Art:
    corpus_path: source_data/Art/wikiart
    table_filter: ["art"]
    workload_slices:
      - agg_only
      - agg_filter
    num_docs: 20
    num_probe_configs: 8
    num_judge_pairs: 14
    num_eval_queries: 3
    min_queries_per_slice: 2
    budget_levels: [1, 2]
    workload_split:
      train_per_slice: 20
      dev_per_slice: 5
      test_per_slice: 5
      min_train_total: 60
    source_phase0: phase0_reward_table_Art.json
    output_file: phase1_comparison_Art_agg_only.json
    probe_context_cache: phase1_Art_agg_only_probe_context.json

  Finan:
    corpus_path: source_data/Finance/finance
    table_filter: ["finance"]
    workload_slices:
      - agg_only
      - agg_filter
    num_docs: 20
    num_probe_configs: 8
    num_judge_pairs: 14
    num_eval_queries: 3
    min_queries_per_slice: 2
    budget_levels: [1, 2]
    workload_split:
      train_per_slice: 20
      dev_per_slice: 5
      test_per_slice: 5
      min_train_total: 60
    source_phase0: phase0_reward_table_Finan.json
    output_file: phase1_comparison_Finan_agg_only.json
    probe_context_cache: phase1_Finan_agg_only_probe_context.json

  Med:
    table_filter: ["disease", "drug", "institution"]
    workload_slices:
      - agg_only
      - agg_filter
      - agg_join
      - agg_filter_join
    num_docs: 20
    num_probe_configs: 8
    num_judge_pairs: 14
    num_eval_queries: 3
    min_queries_per_slice: 2
    budget_levels: [1, 2]
    workload_split:
      train_per_slice: 20
      dev_per_slice: 5
      test_per_slice: 5
      min_train_total: 60
    source_phase0: phase0_reward_table_Med.json
    output_file: phase1_comparison_Med_agg_only.json
    probe_context_cache: phase1_Med_agg_only_probe_context.json

preprocessing:
  Player: "whole_doc"
  Med: "whole_doc"
  Legal: "whole_doc"
  Finan: "whole_doc"
  Finance: "whole_doc"
  Art: "whole_doc"

probing:
  num_probe_configs: 12
  corpus_sample_fraction: 0.20
  min_probe_docs: 20
  judge_pair_budget: 20

precheck:
  num_docs: 20
  num_configs: 8
  num_judge_pairs: 14
  num_eval_queries: 3

phase0:
  num_docs: 20
  num_probe_configs: 8
  num_judge_pairs: 14
  num_eval_queries: 3
  queries_per_slice: 20
  workload_split:
    train_per_slice: 20
    dev_per_slice: 5
    test_per_slice: 5
    min_train_total: 100
    manifest: workload_split_manifest.json
  min_queries_per_slice: 3
  restrict_gt_to_corpus: true
  budget_levels: [1, 2]
  table_filter: ["player"]
  med_table_filter: ["disease", "drug", "institution"]
  surrogates:
    - random_ranking
    - direct_probe_ranking
    - glass_box_proxy
    - llm_judge_btl
    - linear_proxy_glass
    - rf_proxy_glass
  workload_slices:
    - agg_only
    - agg_filter
    - agg_join
    - agg_filter_join
    - agg_temporal

phase1:
  slice: agg_only
  source_phase0: phase0_reward_table_Player.json
  output_file: phase1_comparison_Player_agg_only.json
  probe_context_cache: phase1_agg_only_probe_context.json
  glass_box_spread_threshold: 0.01

config_grid:
  # null = every corpus doc aligned to the test workload (~200 for Player test split)
  num_docs: null

legal:
  corpus_path: source_data/Legal
  num_docs: 20
  num_probe_configs: 8
  num_judge_pairs: 14
  num_eval_queries: 3
  min_queries_per_slice: 3
  budget_levels: [1, 2]
  preprocessing: whole_doc
  schema_mode: denormalized_single_table
  error_matrix_file: legal_error_matrix.csv
  diagnostics_file: legal_diagnostics.json
  surrogate_correlations_file: legal_surrogate_correlations.csv
  phase0_json_file: legal_phase0_reward_table.json
  phase0_csv_file: legal_phase0_reward_table.csv
  phase1_json_file: legal_phase1_comparison_agg_only.json
  phase1_csv_file: legal_phase1_agent_results.csv
  btl_precheck_file: legal_btl_precheck.json
  probe_context_cache: legal_phase1_probe_context.json

finance:
  corpus_path: source_data/Finance
  num_docs: 20
  num_probe_configs: 8
  num_judge_pairs: 14
  num_eval_queries: 3
  min_queries_per_slice: 3
  budget_levels: [1, 2]
  preprocessing: whole_doc
  schema_mode: denormalized_single_table
  error_matrix_file: finance_error_matrix.csv
  diagnostics_file: finance_diagnostics.json
  surrogate_correlations_file: finance_surrogate_correlations.csv
  phase0_json_file: finance_phase0_reward_table.json
  phase0_csv_file: finance_phase0_reward_table.csv
  phase1_json_file: finance_phase1_comparison_agg_only.json
  phase1_csv_file: finance_phase1_agent_results.csv
  btl_precheck_file: finance_btl_precheck.json
  probe_context_cache: finance_phase1_probe_context.json

population_config_space:
  er_strategy:
    - "embedding_0.7"
    - "embedding_0.8"
    - "embedding_0.9"
    - "llm"
  norm_strategy:
    - "dictionary"
    - "llm"
  unit_strategy:
    - "none"
    - "unit"
  miss_strategy:
    - "drop"
    - "mean"
    - "median"
    - "mode"
    - "constant"
    - "llm"
  type_coercion:
    - "strict"
    - "permissive"
    - "llm"

surrogates:
  main:
    - "random_ranking"
    - "direct_probe_ranking"
    - "glass_box_proxy"
    - "llm_judge_btl"
    - "linear_proxy_glass"
    - "rf_proxy_glass"
  ablation:
    - "linear_error"
    - "rf_error"

agent:
  max_turns: 10
  default_risk_level: "risk_neutral"

experiment:
  seed: 42

logging:
  level: "INFO"
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
  datefmt: "%H:%M:%S"

smoke_test:
  num_docs: 10
  num_configs: 4
  num_judge_pairs: 5
  num_eval_queries: 3
  corpus_sample_fraction: 0.01
  min_probe_docs: 2

stage1:
  n_cluster_queries: 3
  schema_variants: ["full", "numeric_only", "entity_only"]

stage2:
  per_cluster_bakeoff: true
  all_surrogates:
    - random_ranking
    - direct_probe_ranking
    - glass_box_proxy
    - llm_judge_btl
    - linear_proxy_glass
    - rf_proxy_glass
    - gbdt_proxy_glass
    - gp_proxy_glass
    - tpe_proxy

stage3:
  risk_level: "risk_neutral"
  risk_lambda: 0.5
  routing_assignment:
    sort_clusters_by_size: true
  # bo_n_trials: 20
  # hyperband_eta: 3

stage4:
  components:
    - surrogate
    - extraction_reuse
    - recalibration
    - routing
    - flat_vs_hier
    - query_clustering
    - schema_pruning
    - cluster_refinement

stage5:
  baselines:
    - default
    - single_best
    - squid
    - random
    - ilp
  sensitivity_params:
    - num_probe_configs
    - corpus_sample_fraction
    - budget
    - config_space_size

threshold_optimization:
  n_trials: 100
  timeout_seconds: 600
  optimal_thresholds_file: optimal_thresholds.json

# Token budget for config selection (int: number of tokens).
# The pipeline deducts probe run cost first; whatever integer tokens
# remain determine how many configs can be selected.
# Rule of thumb: extraction ≈ N_docs × avg_doc_tokens, judge ≈ 2000 × N_pairs.
token_budget: 500000
